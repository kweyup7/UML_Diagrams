me:"Swimlane (partition)",def:"A vertical or horizontal band for each person, role or system. An action drawn inside a lane is that lane\u2019s responsibility.",v:(0,r.jsx)(M,{label:"Swimlanes",children:()=>(0,r.jsxs)(r.Fragment,{children:[(0,r.jsx)("rect",{x:"10",y:"8",width:"90",height:"84",fill:"#fff",stroke:L,strokeWidth:"1.6"}),(0,r.jsx)("rect",{x:"100",y:"8",width:"90",height:"84",fill:"#f8fafc",stroke:L,strokeWidth:"1.6"}),(0,r.jsx)("rect",{x:"10",y:"8",width:"90",height:"22",fill:"#f1f5f9",stroke:L,strokeWidth:"1.6"}),(0,r.jsx)("rect",{x:"100",y:"8",width:"90",height:"22",fill:"#f1f5f9",stroke:L,strokeWidth:"1.6"}),(0,r.jsx)(C,{x:"55",y:"24",textAnchor:"middle",fontSize:"12",fontWeight:"700",children:"Student"}),(0,r.jsx)(C,{x:"145",y:"24",textAnchor:"middle",fontSize:"12",fontWeight:"700",children:"System"})]})})}],ah=[{id:"usecase",short:"Use Case",title:"UML Use Case Diagram",icon:Oo,Diagram:bm,symbols:Vm,intro:"A use case diagram shows what a system does from the outside. It lists the people and systems that use it (actors) and the goals they can achieve (use cases). You draw it early, to agree on scope with stakeholders before any design work.",remember:"Describe what the user wants to achieve, never how the system does it internally.",steps:[{title:"Identify the actors",body:"Ask who uses the system or exchanges information with it. In our case study these are the Student, who books consultations, and the Lecturer, who accepts them. Draw each as a stickman with the role name underneath.",tip:"An actor is a role, not a person: write \u201CStudent\u201D, not \u201CPaul\u201D. External systems can be actors too."},{title:"Draw the system boundary",body:"Draw a large rectangle and write the system name at the top: Consultation Booking System. Everything inside is what you are building. The actors stay outside.",tip:"If you are unsure whether something belongs inside, ask: do we build it, or does it just talk to us?"},{title:"Add the use cases",body:"Inside the boundary, draw one oval for each goal an actor wants to reach. Name each one with a verb and a noun: Book Consultation, Check Availability, Reschedule Booking, Accept Booking, Cancel Booking and Manage Availability.",tip:"Avoid names that describe screens or steps, like \u201CClick Submit\u201D. Describe goals."},{title:"Connect actors with associations",body:"Draw a plain line from each actor to the use cases they take part in. The Student connects to Book Consultation and Cancel Booking. The Lecturer connects to Accept Booking and Manage Availability.",tip:"Do not connect an actor to a use case that is only reached through \xABinclude\xBB or \xABextend\xBB."},{title:"Add \xABinclude\xBB and \xABextend\xBB",body:"Book Consultation always needs a Check Availability, so draw a dashed arrow from Book Consultation to Check Availability labelled \xABinclude\xBB. Rescheduling is optional, so draw a dashed arrow from Reschedule Booking to Book Consultation labelled \xABextend\xBB.",tip:"Include points at the shared, mandatory behaviour. Extend points at the base use case being extended."}]},{id:"sequence",short:"Sequence",title:"UML Sequence Diagram",icon:vo,Diagram:Em,symbols:Gm,intro:"A sequence diagram shows how objects exchange messages over time to carry out one scenario. Participants sit side by side, and time runs from top to bottom. Use it to design and check the flow of a single use case.",remember:"Read it top to bottom. A message lower on the page happens later.",steps:[{title:"Place the participants",body:"Take the Book Consultation use case and list who or what is involved. Along the top, draw the Student (an actor), then rectangles for :BookingSystem, :Database and :Lecturer.",tip:"Order participants so that most messages travel to a neighbour; it avoids crossing lines."},{title:"Draw the lifelines",body:"Drop a dashed vertical line from each participant. A lifeline represents that participant existing over time.",tip:"Do not draw anything on a lifeline yet. Messages come next."},{title:"Add the calls in order",body:"Draw solid arrows with filled heads, top to bottom: 1 requestConsultation, 2 checkAvailability, 4 notifyRequest, 5 acceptBooking and 6 saveBooking. Number each message and label it with an operation name.",tip:"The arrow points to the participant that owns the operation being called."},{title:"Add the return messages",body:"Draw dashed arrows with open heads for replies: 3 slotStatus from the Database and 7 bookingConfirmed back to the Student.",tip:"Only show returns that matter. Leaving out obvious ones keeps the diagram readable."},{title:"Show the activation bars",body:"Draw a thin rectangle on a lifeline from the moment a message arrives until that participant finishes. The BookingSystem stays active through the whole scenario, while the Database is only busy twice.",tip:"A bar that begins at a message and ends at its return shows the call is still running."},{title:"Wrap choices in an alt fragment",body:"Messages 4 to 7 only happen when the slot is free. Draw a frame labelled alt around them with the condition [slot available]. Add a dashed divider and an [else] branch with the message slotUnavailable.",tip:"Other fragments you will meet: opt (optional), loop (repeat) and par (parallel)."}]},{id:"class",short:"Class",title:"UML Class Diagram",icon:Po,Diagram:Um,symbols:Xm,intro:"A class diagram describes the static structure of a system: its classes, their attributes and operations, and how the classes relate. It is the blueprint that developers turn into code.",remember:"Attributes hold data, operations hold behaviour, and relationships say who knows whom.",steps:[{title:"Find the classes",body:"Underline the nouns in the requirements. We keep five: User (abstract), Student, Lecturer, Booking and TimeSlot. Draw a box for each and write its name in the top compartment.",tip:"Class names are singular and capitalised. Abstract classes are written in italics."},{title:"Add the attributes",body:"Add a middle compartment listing the data each class stores. Write them as visibility name: Type, for example - studentNo: String. Shared fields such as email go in User and are inherited.",tip:"Make attributes private (-) by default and expose them through operations."},{title:"Add the operations",body:"Add a bottom compartment with what each class can do: + requestBooking(slot): Booking, + acceptBooking(id): void, + reserve(): void and so on.",tip:"Operations are usually public (+). Skip simple getters and setters to keep the diagram clear."},{title:"Show inheritance",body:"Student and Lecturer both are users, so draw lines from each up to User and finish with a hollow triangle at User. They inherit userId, fullName, email, login() and logout().",tip:"Test it with \u201Cis a\u201D: a Student is a User. If it sounds wrong, it is not inheritance."},{title:"Add associations and multiplicity",body:"One Student makes zero or more Bookings, and one Lecturer receives zero or more Bookings. Draw a line for each, name it with a verb and add multiplicity at both ends: 1 and 0..*.",tip:"Read each end aloud: \u201Cone Student makes zero or more Bookings\u201D."},{title:"Refine the relationships",body:"A Lecturer offers TimeSlots that cannot exist without them, so use a filled diamond (composition) at Lecturer. A Booking points at the one TimeSlot it reserves, so use an arrow (directed association).",tip:"If the part can outlive the whole, use a hollow diamond (aggregation) instead."}]},{id:"er",short:"ER (Chen)",title:"ER Diagram (Chen Notation)",icon:Ro,Diagram:Hm,symbols:jm,intro:"An entity-relationship diagram models the data a system must store. In Chen notation entities are rectangles, attributes are ovals and relationships are diamonds. You draw it before designing tables.",remember:"Chen notation puts everything in its own shape: even a relationship gets a diamond, and can have attributes of its own.",steps:[{title:"Identify the entities",body:"Find the things we need to store data about: STUDENT, LECTURER and TIME_SLOT. Draw each as a rectangle with a singular noun in capitals.",tip:"Ask whether it is a thing we keep many records of. If so, it is likely an entity."},{title:"Add attributes and mark the keys",body:"Draw an oval for each property and join it to its entity. Underline the key attribute that uniquely identifies each instance: studentNo, staffNo and slotId.",tip:"Choose keys that never change. A name is a poor key; an ID is a good one."},{title:"Add special attributes",body:"A student can have several phone numbers, so phoneNo is a multi-valued attribute (double oval). A slot\u2019s duration is worked out from its start and end times, so it is a derived attribute (dashed oval).",tip:"Multi-valued attributes become their own table later. Derived attributes are not stored at all."},{title:"Add the relationships",body:"Draw a diamond for each association and join it to the entities on both sides. A STUDENT BOOKS a LECTURER, and a LECTURER OFFERS TIME_SLOTs.",tip:"Name relationships with verbs so the diagram reads like a sentence: Student books Lecturer."},{title:"Label the cardinality and relationship attributes",body:"A student can book many lecturers and vice versa, so BOOKS is N : M. A lecturer offers many slots, but each slot belongs to one lecturer, so OFFERS is 1 : N. Attach bookingDate, status and topic to BOOKS, because they describe the booking, not either entity.",tip:"If an attribute needs both entities to make sense, it belongs on the relationship."},{title:"Show participation constraints",body:"Every TIME_SLOT must belong to a lecturer, so draw a double line between OFFERS and TIME_SLOT. This is total participation. Single lines mean participation is optional.",tip:"A lecturer may offer no slots yet, so that side stays a single line."}]},{id:"schema",short:"Schema",title:"Relational Database Schema",icon:Eo,Diagram:Wm,symbols:Km,intro:"A relational schema turns the ER diagram into tables, columns and keys that a database can implement. Each table has a primary key, and foreign keys link tables together.",remember:"Every relationship in the ER diagram turns into either a foreign key or a new table.",steps:[{title:"Map each strong entity to a table",body:"STUDENT and LECTURER each become a table. Their simple attributes become columns, and the key attribute becomes the primary key (PK): student_no and staff_no.",tip:"Use snake_case for columns and choose a data type for each one."},{title:"Give the multi-valued attribute its own table",body:"A column cannot hold several phone numbers. Create STUDENT_PHONE with student_no (a foreign key) and phone_no. Together they form a composite primary key.",tip:"Rule: multi-valued attribute \u2192 new table with a FK to the owner."},{title:"Map the 1 : N relationship",body:"A lecturer offers many slots, so TIME_SLOT stores the foreign key staff_no on the \u201Cmany\u201D side. The derived duration is left out because it can be computed.",tip:"Rule: put the FK on the N side. Derived attributes are not stored."},{title:"Turn the M : N relationship into a junction table",body:"Students and lecturers have a many-to-many link, so create BOOKING. It has its own booking_id, two foreign keys (student_no and staff_no) and the relationship attributes bookingDate, status and topic.",tip:"Rule: M : N relationship \u2192 new table holding a FK to each side plus its own attributes."},{title:"Draw the foreign-key references",body:"Draw an arrow from each foreign key to the primary key it refers to, and mark N at the foreign-key end and 1 at the primary-key end. These links keep data consistent: a booking cannot point to a student who does not exist.",tip:"Each FK column must use the same data type as the PK it points to."}]},{id:"dfd0",short:"DFD Level 0",title:"DFD Level 0 (Context Diagram)",icon:Mo,Diagram:$m,symbols:Jm,intro:"A context diagram is the highest-level data flow diagram. It shows the whole system as a single process and every external entity that exchanges data with it. It fixes the system boundary and lists the data that crosses it, without saying how the data is processed or stored.",remember:"One process, no data stores. Show only what crosses the boundary.",steps:[{title:"Draw the system as one process",body:"Draw a single process, numbered 0, and name it after the system: Consultation Booking System. At this level you do not look inside it.",tip:"Numbering it 0 lets its sub-processes be numbered 1.0, 2.0 and 3.0 on the next level."},{title:"Place the external entities",body:"Add the people or systems outside the boundary that send data in or take data out: the Student and the Lecturer.",tip:"An outside system you talk to, such as an email service, is also an external entity."},{title:"Add the incoming data flows",body:"Draw arrows from entities into the process and label each with the data it carries: Booking Request from the Student, and Availability Slots and Booking Decision from the Lecturer.",tip:"Label the data, not the action. Write Booking Request, not \u201CRequest a booking\u201D."},{title:"Add the outgoing data flows",body:"Draw arrows from the process back out: Availability List and Booking Confirmation to the Student, and Booking Notification to the Lecturer. Check that every entity has at least one flow and that there are no data stores.",tip:"Data cannot flow straight from one entity to another. It must pass through a process."}]},{id:"dfd1",short:"DFD Level 1",title:"DFD Level 1",icon:Ma,Diagram:Qm,symbols:Ym,intro:"A Level 1 diagram opens up the single process from the context diagram into its main sub-processes. It also shows the data stores where data rests between them. Everything that crossed the boundary at Level 0 must still cross it here. This is called balancing.",remember:"Every process needs an input and an output. Every data store needs a flow in and a flow out.",steps:[{title:"Break process 0 into sub-processes",body:"List the main jobs the system does and give each a number and a verb-plus-noun name: 1.0 Manage Availability, 2.0 Book Consultation and 3.0 Process Booking Decision. Aim for between three and nine processes.",tip:"Each use case on your use case diagram is a good candidate for a process."},{title:"Bring in the external entities",body:"Copy the Lecturer and the Student from the context diagram. Do not add new ones. The boundary has not changed.",tip:"New entities at this level are a sign that the context diagram was incomplete."},{title:"Add the data stores",body:"Ask what data must be remembered between processes. Availability must survive until a student books it, and bookings must survive until they are decided. Add D1 Time Slots and D2 Bookings.",tip:"Each store usually becomes an entity in your ER diagram and a table in your schema."},{title:"Connect the entities to the processes",body:"Redraw each context-level flow so that it ends at the process that handles it. Availability Slots go to 1.0, Booking Request and Availability List go with 2.0, Booking Decision goes to 3.0, and Booking Notification and Booking Confirmation leave from 2.0 and 3.0.",tip:"Keep the data flow names identical to Level 0. Balancing depends on it."},{title:"Connect the processes and data stores",body:"Show how data moves inside the system. 1.0 writes Slot Details to D1, and D1 supplies Free Slots to 2.0. 2.0 writes a Pending Booking to D2. 3.0 reads Booking Details from D2 and writes back the Booking Status.",tip:"A process always sits between a store and an entity. Never join them directly."},{title:"Check balancing and common errors",body:"Count the flows that cross the boundary. The six highlighted flows match the six on the context diagram exactly. Then check each process for black holes (no output), miracles (no input) and grey holes (output that cannot come from its inputs).",tip:"If a flow appears or disappears between levels, fix one of the diagrams."}]},{id:"activity",short:"Activity",title:"Activity Diagram",icon:No,Diagram:Zm,symbols:eh,intro:"An activity diagram models the workflow of a process: the actions performed, the decisions made and who is responsible for each action. In SSAD it documents the business process that the DFD processes support.",remember:"Follow the arrows from the initial node. A diamond is a choice. A bar means things happening in parallel.",steps:[{title:"Draw the swimlanes",body:"Decide who is involved in booking a consultation and give each a vertical lane: Student, System and Lecturer. Every action will sit in the lane of whoever performs it.",tip:"Put the lanes in the order the work moves between them, so arrows cross as few lanes as possible."},{title:"Add the initial node and the actions",body:"Place a filled circle in the Student lane to start. Then list the actions in each lane: Select lecturer & slot, Check slot availability, Create pending booking, Notify lecturer, Review request, Confirm booking and so on.",tip:"Name each action with a verb and a noun, and keep it to one step."},{title:"Connect the actions with control flows",body:"Draw arrows from the initial node to the first action, and between actions that always follow one another: Select slot \u2192 Check availability, and Create pending booking \u2192 Notify lecturer \u2192 Review request.",tip:"Every action needs exactly one way in and one way out unless it is part of a decision or a fork."},{title:"Add the decisions and guards",body:"Checking availability has two outcomes, so add a diamond labelled Slot free? with the guards [yes] and [no]. [no] sends the student to choose another slot and loops back. After the lecturer reviews the request, add a second diamond, Accepted?, which leads to Confirm booking or Reject & notify student.",tip:"Guards must cover every case and must not overlap."},{title:"Show parallel work with a fork and join",body:"After Confirm booking, Update calendar and Email student can happen at the same time. Draw a fork bar to split the flow, and a join bar to bring it back together.",tip:"A join waits for all of its incoming flows. A merge diamond waits for none."},{title:"Finish with the activity final node",body:"Draw a bullseye at the bottom. Connect the join to it, and connect the rejection branch to it too. Any path that reaches the final node ends the whole activity.",tip:"Walk every path from the initial node to the final node to check that none ends in the middle."}]}],Zf=Object.fromEntries(ah.map(e=>[e.id,e])),Jf=[{id:"ooad",name:"OOAD",full:"Object-Oriented Analysis & Design",modules:["usecase","sequence","class","er","schema"]},{id:"ssad",name:"SSAD",full:"Structured Systems Analysis & Design",modules:["usecase","dfd0","dfd1","activity","er","schema"]}],th={ssad:{usecase:"In SSAD the use case diagram captures requirements before any data flow diagrams are drawn. Each use case usually turns into one or more processes on the Level 1 DFD.",er:"In SSAD the ER diagram describes the data held in your DFD data stores: Time Slots (D1) and Bookings (D2).",schema:"In SSAD the tables are the physical form of the Level 1 data stores, so every store should map to at least one table."},ooad:{er:"In OOAD the ER diagram is often drawn from the class diagram, to design how the persistent classes are stored.",schema:"In OOAD the schema is usually derived from the class diagram: persistent classes become tables and associations become foreign keys."}};function oh({mod:e,step:a,setStep:t}){let o=e.steps.length,l=e.steps[a-1],u=a===o;return(0,r.jsxs)("section",{"aria-label":"Step-by-step case study",className:"rounded-2xl border border-slate-200 bg-white shadow-sm",children:[(0,r.jsxs)("div",{className:"border-b border-slate-100 px-4 py-3 sm:px-6",children:[(0,r.jsxs)("div",{className:"mb-2 flex items-center justify-between gap-3 text-xs font-semibold uppercase tracking-wider text-slate-500",children:[(0,r.jsx)("span",{children:"Student Consultation Booking System"}),(0,r.jsxs)("span",{className:"tabular-nums",children:["Step ",a," of ",o]})
