 a use case that is only reached through \xABinclude\xBB or \xABextend\xBB."},{title:"Add \xABinclude\xBB and \xABextend\xBB",body:"Book Consultation always needs a Check Availability, so draw a dashed arrow from Book Consultation to Check Availability labelled \xABinclude\xBB. Rescheduling is optional, so draw a dashed arrow from Reschedule Booking to Book Consultation labelled \xABextend\xBB.",tip:"Include points at the shared, mandatory behaviour. Extend points at the base use case being extended."}]},{id:"sequence",short:"Sequence",title:"UML Sequence Diagram",icon:Io,Diagram:km,symbols:Fm,intro:"A sequence diagram shows how objects exchange messages over time to carry out one scenario. Participants sit side by side, and time runs from top to bottom. Use it to design and check the flow of a single use case.",remember:"Read it top to bottom. A message lower on the page happens later.",steps:[{title:"Place the participants",body:"Take the Book Consultation use case and list who or what is involved. Along the top, draw the Student (an actor), then rectangles for :BookingSystem, :Database and :Lecturer.",tip:"Order participants so that most messages travel to a neighbour; it avoids crossing lines."},{title:"Draw the lifelines",body:"Drop a dashed vertical line from each participant. A lifeline represents that participant existing over time.",tip:"Do not draw anything on a lifeline yet. Messages come next."},{title:"Add the calls in order",body:"Draw solid arrows with filled heads, top to bottom: 1 requestConsultation, 2 checkAvailability, 4 notifyRequest, 5 acceptBooking and 6 saveBooking. Number each message and label it with an operation name.",tip:"The arrow points to the participant that owns the operation being called."},{title:"Add the return messages",body:"Draw dashed arrows with open heads for replies: 3 slotStatus from the Database and 7 bookingConfirmed back to the Student.",tip:"Only show returns that matter. Leaving out obvious ones keeps the diagram readable."},{title:"Show the activation bars",body:"Draw a thin rectangle on a lifeline from the moment a message arrives until that participant finishes. The BookingSystem stays active through the whole scenario, while the Database is only busy twice.",tip:"A bar that begins at a message and ends at its return shows the call is still running."},{title:"Wrap choices in an alt fragment",body:"Messages 4 to 7 only happen when the slot is free. Draw a frame labelled alt around them with the condition [slot available]. Add a dashed divider and an [else] branch with the message slotUnavailable.",tip:"Other fragments you will meet: opt (optional), loop (repeat) and par (parallel)."}]},{id:"class",short:"Class",title:"UML Class Diagram",icon:Co,Diagram:Pm,symbols:Em,intro:"A class diagram describes the static structure of a system: its classes, their attributes and operations, and how the classes relate. It is the blueprint that developers turn into code.",remember:"Attributes hold data, operations hold behaviour, and relationships say who knows whom.",steps:[{title:"Find the classes",body:"Underline the nouns in the requirements. We keep five: User (abstract), Student, Lecturer, Booking and TimeSlot. Draw a box for each and write its name in the top compartment.",tip:"Class names are singular and capitalised. Abstract classes are written in italics."},{title:"Add the attributes",body:"Add a middle compartment listing the data each class stores. Write them as visibility name: Type, for example - studentNo: String. Shared fields such as email go in User and are inherited.",tip:"Make attributes private (-) by default and expose them through operations."},{title:"Add the operations",body:"Add a bottom compartment with what each class can do: + requestBooking(slot): Booking, + acceptBooking(id): void, + reserve(): void and so on.",tip:"Operations are usually public (+). Skip simple getters and setters to keep the diagram clear."},{title:"Show inheritance",body:"Student and Lecturer both are users, so draw lines from each up to User and finish with a hollow triangle at User. They inherit userId, fullName, email, login() and logout().",tip:"Test it with \u201Cis a\u201D: a Student is a User. If it sounds wrong, it is not inheritance."},{title:"Add associations and multiplicity",body:"One Student makes zero or more Bookings, and one Lecturer receives zero or more Bookings. Draw a line for each, name it with a verb and add multiplicity at both ends: 1 and 0..*.",tip:"Read each end aloud: \u201Cone Student makes zero or more Bookings\u201D."},{title:"Refine the relationships",body:"A Lecturer offers TimeSlots that cannot exist without them, so use a filled diamond (composition) at Lecturer. A Booking points at the one TimeSlot it reserves, so use an arrow (directed association).",tip:"If the part can outlive the whole, use a hollow diamond (aggregation) instead."}]},{id:"er",short:"ER (Chen)",title:"ER Diagram (Chen Notation)",icon:Po,Diagram:Am,symbols:Om,intro:"An entity-relationship diagram models the data a system must store. In Chen notation entities are rectangles, attributes are ovals and relationships are diamonds. You draw it before designing tables.",remember:"Chen notation puts everything in its own shape: even a relationship gets a diamond, and can have attributes of its own.",steps:[{title:"Identify the entities",body:"Find the things we need to store data about: STUDENT, LECTURER and TIME_SLOT. Draw each as a rectangle with a singular noun in capitals.",tip:"Ask whether it is a thing we keep many records of. If so, it is likely an entity."},{title:"Add attributes and mark the keys",body:"Draw an oval for each property and join it to its entity. Underline the key attribute that uniquely identifies each instance: studentNo, staffNo and slotId.",tip:"Choose keys that never change. A name is a poor key; an ID is a good one."},{title:"Add special attributes",body:"A student can have several phone numbers, so phoneNo is a multi-valued attribute (double oval). A slot\u2019s duration is worked out from its start and end times, so it is a derived attribute (dashed oval).",tip:"Multi-valued attributes become their own table later. Derived attributes are not stored at all."},{title:"Add the relationships",body:"Draw a diamond for each association and join it to the entities on both sides. A STUDENT BOOKS a LECTURER, and a LECTURER OFFERS TIME_SLOTs.",tip:"Name relationships with verbs so the diagram reads like a sentence: Student books Lecturer."},{title:"Label the cardinality and relationship attributes",body:"A student can book many lecturers and vice versa, so BOOKS is N : M. A lecturer offers many slots, but each slot belongs to one lecturer, so OFFERS is 1 : N. Attach bookingDate, status and topic to BOOKS, because they describe the booking, not either entity.",tip:"If an attribute needs both entities to make sense, it belongs on the relationship."},{title:"Show participation constraints",body:"Every TIME_SLOT must belong to a lecturer, so draw a double line between OFFERS and TIME_SLOT. This is total participation. Single lines mean participation is optional.",tip:"A lecturer may offer no slots yet, so that side stays a single line."}]},{id:"schema",short:"Schema",title:"Relational Database Schema",icon:Mo,Diagram:Tm,symbols:Um,intro:"A relational schema turns the ER diagram into tables, columns and keys that a database can implement. Each table has a primary key, and foreign keys link tables together.",remember:"Every relationship in the ER diagram turns into either a foreign key or a new table.",steps:[{title:"Map each strong entity to a table",body:"STUDENT and LECTURER each become a table. Their simple attributes become columns, and the key attribute becomes the primary key (PK): student_no and staff_no.",tip:"Use snake_case for columns and choose a data type for each one."},{title:"Give the multi-valued attribute its own table",body:"A column cannot hold several phone numbers. Create STUDENT
